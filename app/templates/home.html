{% extends "base.html" %}

{% block content %}
<div style="text-align: center; margin-top: 100px;">
    <h1 style="font-size: 3.5rem; color: #03e9f4; text-shadow: 0 0 20px rgba(3, 233, 244, 0.5); margin-bottom: 20px;">
        Welcome to RxInsight
    </h1>
    
    <p style="font-size: 1.5rem; margin-bottom: 40px; color: #ddd;">
        Your professional tool for checking drug interactions and side effects safely.
    </p>

    <a href="{{ url_for('index') }}" style="
        display: inline-block;
        padding: 15px 40px; 
        font-size: 1.2rem; 
        border: 2px solid #03e9f4; 
        color: #03e9f4; 
        text-decoration: none;
        text-transform: uppercase; 
        letter-spacing: 2px;
        border-radius: 50px;
        transition: 0.3s;
        background: transparent;">
        Start Search Tool
    </a>

    <div style="margin-top: 20px;">
        <a href="{{ url_for('public_interactions') }}" style="
            display: inline-block;
            padding: 12px 30px; 
            font-size: 1rem; 
            /* GEÄNDERT: Jetzt auch Neon-Blau und 2px Rand */
            border: 2px solid #03e9f4; 
            color: #03e9f4; 
            text-decoration: none;
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-radius: 50px;
            transition: 0.3s;
            background: transparent;">
            Quick Interaction Check
        </a>
    </div>

    <div style="margin-top: 20px;">
        <a href="{{ url_for('public_conditions') }}" style="
            display: inline-block;
            padding: 12px 30px; 
            font-size: 1rem; 
            /* GEÄNDERT: Jetzt auch Neon-Blau und 2px Rand */
            border: 2px solid #03e9f4; 
            color: #03e9f4; 
            text-decoration: none;
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-radius: 50px;
            transition: 0.3s;
            background: transparent;">
            Drug Finder by Disease
        </a>
    </div>

</div>
{% endblock %}
